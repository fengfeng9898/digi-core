<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>数码兽 · 控制器</title>
<style>
  :root{
    --bg:#0b1020; --card:#151c33; --card2:#1b2440; --line:#27324f;
    --txt:#e8eefc; --muted:#8fa0c4; --cyan:#3ee6ff; --green:#37e08b;
    --amber:#ffc247; --red:#ff5c72; --violet:#a78bfa;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#16224a 0%,var(--bg) 55%);
       color:var(--txt);font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       padding:14px 14px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
  h1{font-size:17px;margin:0 0 10px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
  h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 8px currentColor}
  h1 .dot.on{background:var(--green)}
  .bar{display:flex;gap:8px;margin-bottom:12px}
  .bar input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);
             border-radius:10px;padding:10px 12px;font-size:14px;outline:none}
  .bar input:focus{border-color:var(--cyan)}
  .bar button{background:var(--cyan);color:#04121a;border:0;border-radius:10px;padding:0 16px;
              font-weight:700;font-size:14px}
  .card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
        border-radius:16px;padding:14px;margin-bottom:12px}
  .stage{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .stage b{font-size:20px;letter-spacing:.5px}
  .stage span{color:var(--muted);font-size:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:#0f1730;border:1px solid var(--line);border-radius:12px;padding:9px 11px}
  .stat i{display:block;color:var(--muted);font-size:11px;font-style:normal;margin-bottom:3px}
  .stat b{font-size:16px;font-variant-numeric:tabular-nums}
  .meter{height:8px;border-radius:6px;background:#0a1striped;background:#0a1024;overflow:hidden;margin-top:8px}
  .meter>div{height:100%;border-radius:6px;transition:width .25s}
  .row{display:flex;gap:8px;align-items:center;margin-top:10px}
  .row label{color:var(--muted);font-size:12px;width:52px;flex:none}
  .row .meter{flex:1;margin:0}
  .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .acts button,.cards button{background:#111a33;border:1px solid var(--line);color:var(--txt);
      border-radius:12px;padding:12px 4px;font-size:13px;font-weight:600;line-height:1.25}
  .acts button:active,.cards button:active{background:#1c2a4d;transform:scale(.97)}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .cards button{padding:10px 4px}
  .cards button small{display:block;color:var(--muted);font-weight:400;font-size:10px;margin-top:2px}
  .cards .ready{border-color:var(--amber);box-shadow:0 0 0 1px rgba(255,194,71,.25) inset}
  .log{max-height:190px;overflow:auto;font-size:12.5px;color:var(--muted)}
  .log div{padding:5px 0;border-bottom:1px dashed #1e2843;display:flex;justify-content:space-between;gap:10px}
  .log div:last-child{border:0}
  .log em{color:var(--txt);font-style:normal}
  .sec-t{color:var(--muted);font-size:12px;margin:16px 0 8px;letter-spacing:1px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
     background:#1d2a4d;border:1px solid var(--line);color:var(--txt);padding:10px 18px;
     border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:86vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .warn{color:var(--amber);font-size:11.5px}
</style>
</head>
<body>

<h1><span class="dot" id="dot"></span>数码兽 · 控制器</h1>

<div class="bar">
  <input id="host" placeholder="设备地址，如 192.168.0.53" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button onclick="connect()">连接</button>
</div>

<div class="card">
  <div class="stage">
    <b id="st">--</b>
    <span id="meta">未连接</span>
  </div>
  <div class="grid2">
    <div class="stat"><i>体力 HP</i><b id="hp">--</b><div class="meter"><div id="hpb" style="width:0;background:var(--green)"></div></div></div>
    <div class="stat"><i>心情 MOOD</i><b id="mood">--</b><div class="meter"><div id="moodb" style="width:0;background:var(--cyan)"></div></div></div>
  </div>
  <div class="row"><label>饥饿</label><div class="meter"><div id="hgb" style="width:0;background:var(--amber)"></div></div></div>
  <div class="grid2" style="margin-top:10px">
    <div class="stat"><i>战绩</i><b id="rec">--</b></div>
    <div class="stat"><i>年龄</i><b id="age">--</b></div>
  </div>
</div>

<div class="sec-t">操作</div>
<div class="acts">
  <button onclick="act('feed')">🍖<br>喂食</button>
  <button onclick="act('clean')">🧹<br>清洁</button>
  <button onclick="act('train')">💪<br>训练</button>
  <button onclick="act('battle')">⚔️<br>战斗</button>
  <button onclick="act('pet')">🤚<br>抚摸</button>
  <button onclick="act('sleep')">🌙<br>睡觉</button>
  <button onclick="act('wake')">☀️<br>醒来</button>
  <button onclick="act('evolve')">✨<br>进化</button>
</div>

<div class="sec-t">升级卡</div>
<div class="cards">
  <button onclick="card('courage')">🦁 勇气<small>解锁究极体</small></button>
  <button onclick="card('battle')" id="battleCard">⚔️ 战斗<small>下一战进化</small></button>
  <button onclick="card('power')">⚡ 力量<small>攻击 +5</small></button>
  <button onclick="card('guard')">🛡 守护<small>防御 +5</small></button>
  <button onclick="card('heal')">❤️ 回复<small>全恢复</small></button>
  <button onclick="card('revive')">✨ 复活<small>死亡再生</small></button>
</div>

<div class="sec-t">最近事件</div>
<div class="card"><div class="log" id="log"><div><em>暂无</em><span></span></div></div></div>

<div class="sec-t">设置</div>
<div class="card">
  <div class="row"><label>亮度</label><input id="bright" type="range" min="10" max="255" value="90" style="flex:1" oninput="setBright(this.value)"></div>
  <div class="row" style="gap:8px">
    <button onclick="act('warp',1)" style="flex:1">快进 1h</button>
    <button onclick="act('warp',6)" style="flex:1">6h</button>
    <button onclick="act('warp',24)" style="flex:1">24h</button>
  </div>
  <div class="row"><span class="warn">快进会真的推进宠物年龄，正式养成时别用。</span></div>
</div>

<div class="toast" id="toast"></div>

<script>
const EV = {1:'孵化',2:'进化',3:'喂食',4:'清洁',5:'训练',6:'胜利',7:'失败',8:'便便',9:'生病',
            10:'捡到东西',11:'呼唤',12:'睡觉',13:'醒来',14:'使用卡片',15:'死亡',16:'被无视',
            17:'治疗',18:'安抚',19:'野生遭遇',20:'退化'};
const STAGE = ['蛋','幼年期','成长期','成熟期','完全体','究极体','死亡'];
const ITEM = {1:'勇气',8:'力量',16:'守护',32:'复活',64:'战斗卡'};

let base = localStorage.getItem('digiHost') || '';
let timer = null, last = null;

const $ = id => document.getElementById(id);

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1600);
}
function normHost(v){
  v = (v||'').trim().replace(/\/+$/,'');
  if(!v) return '';
  if(!/^https?:\/\//.test(v)) v = 'http://' + v;
  return v;
}
function connect(){
  const h = normHost($('host').value);
  if(!h){ toast('先填设备地址'); return; }
  base = h; localStorage.setItem('digiHost', h);
  $('host').value = h;
  if(timer) clearInterval(timer);
  refresh();
  timer = setInterval(refresh, 1500);
  toast('已连接 ' + h.replace(/^https?:\/\//,''));
}
async function api(path){
  const r = await fetch(base + path, {cache:'no-store'});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
async function refresh(){
  if(!base) return;
  try{
    const s = await api('/api/state');
    last = s; apply(s);
    $('dot').classList.add('on');
  }catch(e){
    $('dot').classList.remove('on');
    $('meta').textContent = '连接失败';
  }
}
function act(cmd, h){
  if(!base){ toast('还没连接'); return; }
  const url = (cmd === 'warp') ? '/api/warp?h=' + h : '/api/act?c=' + cmd;
  fetch(base + url, {cache:'no-store'}).then(r=>r.json()).then(j=>{
    toast(j.msg || (j.ok ? 'ok' : '没成功'));
    if(j.state) apply(j.state);
  }).catch(()=>toast('请求失败'));
}
function card(id){
  if(!base){ toast('还没连接'); return; }
  fetch(base + '/api/card?id=' + id, {cache:'no-store'}).then(r=>r.json()).then(j=>{
    toast(j.msg || 'ok'); if(j.state) apply(j.state);
  }).catch(()=>toast('请求失败'));
}
function setBright(v){
  if(!base) return;
  fetch(base + '/api/bright?b=' + v, {cache:'no-store'}).catch(()=>{});
}
function apply(s){
  $('st').textContent = STAGE[s.stage] + (s.speciesCn && s.stage>0 ? ' · ' + s.speciesCn : '');
  const hh = String(s.hour).padStart(2,'0'), mm = String(s.min).padStart(2,'0');
  $('meta').textContent = `${s.alive ? (s.sleeping?'睡觉中':'活跃') : '已故'} · ${hh}:${mm} · ${s.scene===0?'白天':'黑夜'}`;
  $('hp').textContent = s.hp + '/100';
  $('mood').textContent = s.mood + '/100';
  $('hgb').style.width = (s.hunger*25) + '%';
  $('hpb').style.width = s.hp + '%';
  $('moodb').style.width = s.mood + '%';
  $('moodb').style.background = s.mood>60 ? 'var(--green)' : s.mood>30 ? 'var(--amber)' : 'var(--red)';
  $('rec').textContent = s.wins + '胜 ' + s.losses + '负';
  const d = s.age/86400, h = (s.age%86400)/3600;
  $('age').textContent = d>=1 ? d.toFixed(1)+' 天' : h.toFixed(1)+' 小时';
  $('bright').value = s.bright;

  const items = s.items || 0;
  $('battleCard').classList.toggle('ready', !!(items & 64));

  const log = $('log'); log.innerHTML = '';
  const evs = (s.ev||[]).slice(0,12);
  if(!evs.length){ log.innerHTML = '<div><em>暂无</em><span></span></div>'; }
  for(const [t,k] of evs){
    const div = document.createElement('div');
    const dt = new Date(t*1000);
    const ts = String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
    div.innerHTML = `<span>${ts}</span><em>${EV[k]||('事件'+k)}</em>`;
    log.appendChild(div);
  }
}

const saved = localStorage.getItem('digiHost');
if(saved){ $('host').value = saved; base = saved; refresh(); timer = setInterval(refresh, 1500); }
else { $('host').value = 'digicore.local'; }
</script>
</body>
</html>
