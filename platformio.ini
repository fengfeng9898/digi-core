; ============================================================================
;  DIGI-CORE  —  ESP32-DevKitC-32E + HUB75E 64x64 RGB matrix virtual pet
; ============================================================================
;  Board      : ESP32-DevKitC-32E  (ESP32-WROOM-32E, 4MB flash, NO PSRAM)
;  Panel      : HUB75E 64x64 P3, 1/32 scan  -> E pin REQUIRED
;  Framework  : Arduino (ESP32 core 2.x via platformio espressif32 6.x)
;
;  Why no PSRAM config: the HUB75 DMA library *must* keep its DMA buffers in
;  internal SRAM on a standard ESP32. PSRAM is unusable for this purpose.
;  See refs/ESP32-HUB75-MatrixPanel-DMA-README.md  ("Memory Requirements")
; ============================================================================

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform      = espressif32@6.8.1
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; ---- matrix colour depth (runtime-settable, this is the default) ----
    ; 64x64 1/32 scan: 6 bits keeps ~180 Hz refresh at 16 MHz I2S clock.
    -DPIXEL_COLOR_DEPTH_BITS=6
    -DNO_CIE1931

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#3.0.5

; 4MB flash: 用 huge_app 分区，app 空间 3MB（精灵数据放 Flash，后期还要加素材）
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
