<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIGI-CORE · 网页预览</title>
<style>
  :root { --bg:#0b0f14; --card:#151b23; --line:#21262d; --fg:#e6edf3; --muted:#8b949e; --green:#3fb950; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; padding:18px; }
  h1 { font-size:16px; letter-spacing:.16em; color:#7ee787; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:16px; }
  .wrap { display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap; }
  .screen-box { background:#0f141a; border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:0 10px 40px #0006; }
  canvas { width:384px; height:384px; image-rendering:pixelated; display:block; border-radius:6px; background:#000; }
  .hint { text-align:center; color:#484f58; font-size:11px; margin-top:10px; }
  .panel { flex:1; min-width:320px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; align-items:baseline; margin:5px 0; }
  .name { font-size:20px; font-weight:700; }
  .muted { color:var(--muted); font-size:12px; }
  .num { font-variant-numeric:tabular-nums; font-weight:600; }
  .bar { height:8px; background:#0d1117; border-radius:99px; overflow:hidden; margin:3px 0 9px; }
  .bar > i { display:block; height:100%; border-radius:99px; transition:width .2s, background .2s; }
  .grid { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; text-align:center; }
  .grid .k { color:var(--muted); font-size:11px; }
  .grid .v { font-weight:600; font-variant-numeric:tabular-nums; }
  button { font:inherit; border:1px solid #30363d; background:#21262d; color:var(--fg); border-radius:10px; padding:10px 6px; cursor:pointer; transition:.12s; }
  button:hover { background:#30363d; }
  button:active { transform:scale(.96); }
  button.p { background:#238636; border-color:#2ea043; color:#fff; }
  button.on { background:#1f6feb; border-color:#388bfd; color:#fff; }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .speeds { display:flex; gap:6px; }
  .speeds button { flex:1; font-size:13px; padding:8px 0; }
  .feed { font-size:12px; color:var(--muted); line-height:1.95; max-height:190px; overflow:auto; }
  .feed b { color:var(--fg); font-weight:600; }
  .feed .tm { color:#484f58; font-size:11px; margin-right:8px; }
  #toast { position:fixed; left:50%; bottom:28px; transform:translate(-50%,18px); background:#1f6feb; color:#fff; padding:9px 18px; border-radius:99px; font-size:13px; opacity:0; transition:.22s; pointer-events:none; }
  #toast.on { opacity:1; transform:translate(-50%,0); }
  .sec { color:var(--muted); font-size:12px; margin-bottom:8px; }
  @media (max-width: 820px) { body { padding:12px; } canvas { width:min(92vw,384px); height:min(92vw,384px); } .screen-box { width:100%; text-align:center; } }
</style>
</head>
<body>

<h1>DIGI-CORE</h1>
<div class="sub">网页预览 · 与固件同一套像素/动画/规则 · 拖动速度可快速验证 15~30 天周期</div>

<div class="wrap">
  <div class="screen-box">
    <canvas id="screen" width="64" height="64"></canvas>
    <div class="hint">64×64 · 点击右侧按钮操作</div>
  </div>

  <div class="panel">
    <div class="card">
      <div class="row">
        <div>
          <div class="name" id="pname">—</div>
          <div class="muted" id="pstage">—</div>
        </div>
        <span class="muted" id="ptime">—</span>
      </div>
      <div class="row"><span class="muted">心情</span><span class="num" id="moodv">—</span></div>
      <div class="bar"><i id="moodb" style="width:0;background:#3fb950"></i></div>
      <div class="row"><span class="muted">体力</span><span class="num" id="hpv">—</span></div>
      <div class="bar"><i id="hpb" style="width:0;background:#58a6ff"></i></div>
      <div class="grid">
        <div><div class="k">饥饿</div><div class="v" id="hunger">—</div></div>
        <div><div class="k">攻/防</div><div class="v" id="ad">—</div></div>
        <div><div class="k">体重</div><div class="v" id="wt">—</div></div>
        <div><div class="k">年龄</div><div class="v" id="age">—</div></div>
      </div>
      <div class="row" style="margin-top:10px"><span class="muted">下一阶段</span><span class="num" id="eta">—</span></div>
      <div class="row"><span class="muted">战绩</span><span class="num" id="wl">—</span></div>
      <div class="row"><span class="muted">战斗卡</span><span class="num" id="bcard">—</span></div>
    </div>

    <div class="card">
      <div class="btns">
        <button class="p" onclick="act('feed')">🍖 喂食</button>
        <button onclick="act('clean')">🧹 清洁</button>
        <button onclick="act('train')">💪 训练</button>
        <button onclick="act('battle')">⚔️ 战斗</button>
        <button onclick="act('pet')">🤚 安抚</button>
        <button onclick="act('sleep')">🌙 睡觉</button>
        <button onclick="act('wake')">☀️ 唤醒</button>
        <button onclick="act('evolve')">🧬 进化检查</button>
      </div>
    </div>

    <div class="card">
      <div class="sec">卡片</div>
      <div class="btns">
        <button onclick="card('courage')">🦁 勇气卡</button>
        <button onclick="card('battle')">⚔️ 战斗卡</button>
        <button onclick="card('power')">⚡ 力量卡</button>
        <button onclick="card('guard')">🛡 守护卡</button>
        <button onclick="card('heal')">❤️ 回复卡</button>
      </div>
    </div>

    <div class="card">
      <div class="sec">时间速度</div>
      <div class="speeds">
        <button data-sp="1" onclick="setSpeed(1,this)">1×</button>
        <button data-sp="60" onclick="setSpeed(60,this)">60×</button>
        <button data-sp="600" onclick="setSpeed(600,this)">600×</button>
        <button data-sp="3600" class="on" onclick="setSpeed(3600,this)">3600×</button>
      </div>
      <div class="sec" style="margin-top:12px">场景</div>
      <div class="speeds scenes">
        <button class="on" onclick="setScene('auto',this)">自动</button>
        <button onclick="setScene('day',this)">白天</button>
        <button onclick="setScene('night',this)">黑夜</button>
      </div>
      <div class="row" style="margin-top:10px">
        <label class="muted"><input type="checkbox" id="auto" checked> 自动照料（喂食/清洁/战斗）</label>
        <button onclick="reset()" style="padding:6px 10px;font-size:12px">重开</button>
      </div>
    </div>

    <div class="card">
      <div class="sec">最近事件</div>
      <div class="feed" id="feed">—</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="data.js"></script>
<script src="bg_data.js"></script>
<script src="game.js"></script>
<script src="render.js"></script>
<script src="battle.js"></script>
<script src="bg.js"></script>
<script>
const { Pet, EV } = DigiGame;
const EV_CN = {1:'孵化',2:'进化',3:'喂食',4:'清洁',5:'训练',6:'战斗胜利',7:'战斗失败',8:'便便',
               9:'生病',10:'捡到东西',11:'呼唤',12:'睡觉',13:'醒来',14:'使用卡片',15:'死亡',
               16:'被无视',17:'治疗',18:'安抚',19:'野生遭遇',20:'退化'};

let gameNow = Date.now() / 1000;
let speed = 3600;
let lastMs = performance.now();
let panelAt = 0;
let autoAt = 0;

const pet = new Pet(gameNow);
const R = new DigiRenderer(document.getElementById('screen'), window.DIGI_DATA);
const bg = new DigiBackground(window.DIGI_BG);
R.bg = bg;
R.sceneMode = 'auto';
const battle = new DigiBattle(window.DIGI_DATA, R);

function pickEnemy(myChar) {
  const pool = ['koromon', 'agumon', 'greymon'].filter(k => k !== myChar);
  return pool[Math.floor(Math.random() * pool.length)] || myChar;
}

function fmt(sec) {
  sec = Math.max(0, Math.floor(sec));
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  if (d > 0) return d + ' 天 ' + h + ' 时';
  if (h > 0) return h + ' 时 ' + m + ' 分';
  return m + ' 分';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('on'), 1400);
}

function act(cmd, silent) {
  if (battle.active && !silent) return;         // 战斗演出期间不接受新指令
  const hpBefore = pet.hp;
  const r = pet.act(cmd, gameNow);
  if (cmd === 'battle' && r.win !== undefined && !silent) {
    // 战斗卡临时进化：有动画就用进化后的形态，没有素材（机械暴龙兽/战斗暴龙兽）就回退到当前形态
    const baseChar = R.charForSpecies(pet.species) || 'agumon';
    const formChar = r.battleForm ? R.charForSpecies(r.battleForm) : null;
    const myChar = (formChar && window.DIGI_DATA.chars[formChar]) ? formChar : baseChar;
    battle.start({
      win: r.win,
      myChar,
      enemyChar: pickEnemy(myChar),
      hpBefore,
      hpAfter: pet.hp,
      revert: !!r.revert && !!formChar
    }, performance.now());
  }
  toast(r.msg);
  renderPanel();
}

function card(id) {
  const r = pet.card(id, gameNow);
  toast(r.msg);
  renderPanel();
}

function setScene(m, el) {
  R.sceneMode = m;
  document.querySelectorAll('.scenes button').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
}

function setSpeed(s, el) {
  speed = s;
  document.querySelectorAll('.speeds button').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
}

function reset() {
  pet.newGame(gameNow);
  R.anim.key = null;
  toast('已重开');
  renderPanel();
}

function autoCare() {
  if (battle.active) return;
  if (!document.getElementById('auto').checked) return;
  if (gameNow - autoAt < 7200) return;   // 每 2 游戏小时照料一次
  autoAt = gameNow;
  if (pet.hunger < 3) act('feed', true);
  if (pet.poops > 0) act('clean', true);
  if (pet.pending === 2) act('pet', true);
  if (pet.stage === 4 && !(pet.items & 1)) card('courage');   // 模拟玩家用勇气卡
  if (pet.hp < 45) card('heal');                              // 受伤就回血，避免退化
  if (pet.pending === 1 && pet.hp > 25) act('battle', true);
  else if (pet.hp > 40 && pet.stage >= 2 && !pet.sleeping && Math.random() < 0.5) act('battle', true);
}

function renderPanel() {
  const s = pet.snapshot(gameNow);
  document.getElementById('pname').textContent = s.speciesName;
  document.getElementById('pstage').textContent =
    s.stageName + (!s.alive ? ' · 已死亡' : '') + (s.sick ? ' · 生病' : '');
  document.getElementById('ptime').textContent = fmt(s.age);
  document.getElementById('moodv').textContent = s.mood;
  document.getElementById('hpv').textContent = s.hp;
  document.getElementById('moodb').style.width = s.mood + '%';
  document.getElementById('moodb').style.background = s.mood > 60 ? '#3fb950' : (s.mood > 30 ? '#d29922' : '#f85149');
  document.getElementById('hpb').style.width = s.hp + '%';
  document.getElementById('hunger').textContent = s.hunger + '/4';
  document.getElementById('ad').textContent = s.atk + '/' + s.def;
  document.getElementById('wt').textContent = s.weight + 'g';
  document.getElementById('age').textContent = fmt(s.age);
  document.getElementById('eta').textContent = (s.winsNeed > 0 && s.wins < s.winsNeed)
    ? '还需 ' + (s.winsNeed - s.wins) + ' 胜'
    : (s.alive ? fmt(s.evolveIn) : '—');
  document.getElementById('wl').textContent = s.wins + ' 胜 / ' + s.losses + ' 负';
  document.getElementById('bcard').textContent = s.battleCard ? '⚔️ 就绪（下一战临时进化）' : '—';

  document.getElementById('feed').innerHTML = (s.log || []).slice(0, 8).map(e => {
    const ago = Math.max(0, gameNow - e.t);
    const a = ago < 60 ? '刚刚' : (ago < 3600 ? Math.floor(ago / 60) + ' 分钟前' : fmt(ago) + '前');
    return '<div><span class="tm">' + a + '</span><b>' + (EV_CN[e.k] || ('事件' + e.k)) + '</b></div>';
  }).join('') || '<div>还没有事件</div>';
}

function loop(ms) {
  const dt = Math.min(0.25, (ms - lastMs) / 1000);
  lastMs = ms;
  gameNow += dt * speed;
  pet.tick(gameNow);
  autoCare();
  R.nowSec = gameNow;
  if (battle.active) battle.draw(R.ctx, ms, gameNow);
  else R.draw(pet, ms, gameNow);
  if (ms - panelAt > 120) { panelAt = ms; renderPanel(); }
  requestAnimationFrame(loop);
}

renderPanel();
requestAnimationFrame(loop);
</script>
</body>
</html>
